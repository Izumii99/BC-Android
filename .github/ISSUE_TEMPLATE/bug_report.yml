name: Bug Report
description: Report an issue or unexpected behavior in BC Android
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please verify that you are running the latest version before submitting.
  - type: dropdown
    id: build-variant
    attributes:
      label: Build Variant
      description: Which build of BC Android are you running?
      options:
        - Standard APK
        - Discreet APK (Stealth / Hidden)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App Version
      description: What version are you using (e.g. v2.0.6)?
      placeholder: v2.0.6
    validations:
      required: true
  - type: dropdown
    id: android-version
    attributes:
      label: Android Version
      options:
        - Android 15
        - Android 14
        - Android 13
        - Android 12
        - Android 11
        - Android 10
        - Android 9 / 8 (Oreo/Pie)
    validations:
      required: true
  - type: input
    id: device-model
    attributes:
      label: Device Model
      description: What device are you using (e.g. Samsung Galaxy S23, Xiaomi 13, Pixel 8)?
      placeholder: Samsung Galaxy S23
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Open BC Android
        2. Go to ...
        3. Tap on ...
        4. See error or unexpected scaling/keyboard behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
  - type: checkboxes
    id: checklist
    attributes:
      label: Verification Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I am using the latest released version of BC Android.
          required: false
