name: 'Build and Release APK'

'on':
  push:
    tags:
      - '[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version / tag (e.g., 2.0.6)'
        required: false
        default: '2.0.6'
        type: string
      title:
        description: 'Release Title Highlight (Title Case)'
        required: false
        default: 'Smart Background Render Burst, Character Pre-Loading & Animation Fluidity'
        type: string
      notes:
        description: 'Custom Release Notes (leave empty to use standard template)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Sync upstream scripts from BC-Desktop
        shell: bash
        run: |
          git clone --depth 1 https://github.com/Izumii99/BC-Desktop.git temp-desktop
          cp -r temp-desktop/Scripts/* app/src/main/assets/addons/
          rm -rf temp-desktop

      - name: Build Release APKs
        run: |
          ./gradlew assembleStandardRelease assembleDiscreetRelease --stacktrace

      - name: Prepare APK Artifacts
        shell: bash
        run: |
          mkdir -p publish
          find app/build/outputs/apk/standard/release/ -name "*.apk" -exec cp {} publish/BC-Android-Standard-Release.apk \;
          find app/build/outputs/apk/discreet/release/ -name "*.apk" -exec cp {} publish/BC-Android-Discreet-Release.apk \;
          ls -lh publish/

      - name: Prepare Tag and Release Notes
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          INPUT_VER="${INPUT_VERSION:-}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            REF_TAG="${GITHUB_REF_NAME#v}"
          else
            REF_TAG=""
          fi
          VER="${INPUT_VER:-${REF_TAG:-2.0.6}}"

          TITLE="${INPUT_TITLE:-Smart Background Render Burst, Character Pre-Loading & Animation Fluidity}"
          CUSTOM_NOTES="${INPUT_NOTES:-}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$VER" || true
          git push origin "$VER" --force || true

          if [ -n "$CUSTOM_NOTES" ]; then
            printf "%s\n" "$CUSTOM_NOTES" > RELEASE_NOTES.md
          fi

          echo "RELEASE_VER=$VER" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$TITLE" >> $GITHUB_ENV

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VER }}
          name: BC Android ${{ env.RELEASE_VER }} - ${{ env.RELEASE_TITLE }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            publish/BC-Android-Standard-Release.apk
            publish/BC-Android-Discreet-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
