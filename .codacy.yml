---
exclude_paths:
  - ".github/**"
  - "publish/**"
  - "build/**"
  - "app/build/**"
  - ".gradle/**"
  - "state/**"
  - "Assets/**"
  - "app/src/main/assets/addons/**"
  - "**.min.js"

engines:
